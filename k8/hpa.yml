apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: online-app-hpa
  namespace: online-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: online-app-deployment
  minReplicas: 3
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
